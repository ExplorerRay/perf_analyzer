config_template:
  model_names: gemma3:1b

  analyze:
    # Uncomment the lines below to enable the analyze subcommand
    # # For further details see analyze.md
    #   concurrency:
    #     start: 1
    #     stop: 1024

  endpoint:
    model_selection_strategy: round_robin
    #backend: vllm
    custom:
    type: chat
    streaming: False
    #server_metrics_urls: http://localhost:9400/metrics
    url: 10.5.6.103:11434
    grpc_method:

  perf_analyzer:
    path: perf_analyzer
    verbose: False
    stimulus: {'concurrency': 1}
    stability_percentage: 999
    warmup_request_count: 3

    measurement:
      mode: request_count
      # If left unset, the default value will be inferred based on the mode.
      num:

  input:
    batch_size: 1
    extra:
    goodput:
    header:
    file:
    num_dataset_entries: 100
    random_seed: 0

    audio:
      batch_size: 1
      format: wav
      depths: 16
      sample_rates: 16
      num_channels: 1

      length:
        mean: 0
        stddev: 0

    image:
      batch_size: 1
      format: png

      width:
        mean: 0
        stddev: 0

      height:
        mean: 0
        stddev: 0

    output_tokens:
      mean: 50
      #deterministic: False
      stddev: 0

    synthetic_tokens:
      mean: 550
      stddev: 0

    prefix_prompt:
      num: 0
      length: 100

    sessions:
      num: 0

      turns:
        mean: 1
        stddev: 0

      turn_delay:
        mean: 0
        ratio: 1.0
        stddev: 0

  output:
    artifact_directory: artifacts
    checkpoint_directory: checkpoint
    profile_export_file: profile_export.json
    generate_plots: False
    enable_checkpointing: False

  tokenizer:
    # By default this is the model's name
    name: hf-internal-testing/llama-tokenizer
    revision: main
    trust_remote_code: False

  process:
    # Uncomment the lines below to enable the process-export-files subcommand
    #   input_path:
